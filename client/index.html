<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>De Wura & Alfred Exotic Place Hotel — Hospitality At Its Peak</title>
    <meta name="description" content="De Wura & Alfred Exotic Place Hotel: lodging, lounge, VIP bar, kitchen, night club and more. Book your stay online." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Default head, mirroring the crawler prerender (server/prerender.js).
         usePageMeta() rewrites title/meta/canonical per route at runtime —
         this is just the consistent first paint before JS runs. -->
    <link rel="canonical" href="/" />
    <meta name="robots" content="index,follow" />
    <!-- LCP preload: the hero AVIF variant starts fetching before the bundle
         parses. usePageMeta() rewrites imagesrcset/imagesizes/href to the
         current route's hero at runtime — keep href/srcset in sync with
         `npm run generate:images`. -->
    <link rel="preload" as="image" type="image/avif" href="/images/resp/hero-1200.avif"
          imagesrcset="/images/resp/hero-480.avif 480w, /images/resp/hero-800.avif 800w, /images/resp/hero-1200.avif 1200w"
          imagesizes="100vw" data-page-meta="preload" />
    <!-- Rich link previews — per page usePageMeta() overwrites these at runtime. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="De Wura & Alfred Exotic Place Hotel" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:title" content="De Wura & Alfred Exotic Place Hotel — Hospitality At Its Peak" />
    <meta property="og:description" content="De Wura & Alfred Exotic Place Hotel: lodging, lounge, VIP bar, kitchen, night club and more. Book your stay online." />
    <meta property="og:url" content="https://wura-y0y5.onrender.com/" />
    <meta property="og:image" content="https://wura-y0y5.onrender.com/social/home.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="De Wura & Alfred Exotic Place Hotel — Hospitality At Its Peak" />
    <meta name="twitter:description" content="De Wura & Alfred Exotic Place Hotel: lodging, lounge, VIP bar, kitchen, night club and more. Book your stay online." />
    <meta name="twitter:image" content="https://wura-y0y5.onrender.com/images/hero.jpg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>

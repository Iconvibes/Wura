<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="favBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c2747"/>
      <stop offset="1" stop-color="#0a0f20"/>
    </linearGradient>
    <linearGradient id="favGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e6c25a"/>
      <stop offset="0.5" stop-color="#d4af37"/>
      <stop offset="1" stop-color="#b8902a"/>
    </linearGradient>
    <linearGradient id="favGlow" cx="0.5" cy="0.4" r="0.6" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="rgba(212,175,55,0.22)"/>
      <stop offset="1" stop-color="rgba(0,0,0,0)"/>
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="22" fill="url(#favBg)"/>
  <rect width="100" height="100" rx="22" fill="url(#favGlow)"/>

  <!-- Building facade -->
  <rect x="16" y="30" width="68" height="56" rx="4" fill="none" stroke="rgba(212,175,55,0.3)" stroke-width="0.8"/>

  <!-- Windows row 1 -->
  <rect x="22" y="36" width="12" height="12" rx="1.2" fill="rgba(212,175,55,0.15)" stroke="rgba(212,175,55,0.4)" stroke-width="0.6"/>
  <rect x="38" y="36" width="12" height="12" rx="1.2" fill="rgba(212,175,55,0.12)" stroke="rgba(212,175,55,0.4)" stroke-width="0.6"/>
  <rect x="54" y="36" width="12" height="12" rx="1.2" fill="rgba(212,175,55,0.10)" stroke="rgba(212,175,55,0.4)" stroke-width="0.6"/>

  <!-- Windows row 2 -->
  <rect x="22" y="52" width="12" height="12" rx="1.2" fill="rgba(212,175,55,0.12)" stroke="rgba(212,175,55,0.4)" stroke-width="0.6"/>
  <rect x="38" y="52" width="12" height="12" rx="1.2" fill="rgba(212,175,55,0.18)" stroke="rgba(212,175,55,0.4)" stroke-width="0.6"/>
  <rect x="54" y="52" width="12" height="12" rx="1.2" fill="rgba(212,175,55,0.10)" stroke="rgba(212,175,55,0.4)" stroke-width="0.6"/>

  <!-- Door -->
  <rect x="48" y="64" width="10" height="22" rx="1.5" fill="rgba(212,175,55,0.08)" stroke="rgba(212,175,55,0.5)" stroke-width="0.8"/>
  <circle cx="56" cy="76" r="0.8" fill="rgba(212,175,55,0.7)"/>

  <!-- Marquee / canopy -->
  <path d="M14 64 L50 58 L86 64" fill="none" stroke="url(#favGold)" stroke-width="1.2"/>
  <rect x="14" y="63" width="72" height="2.5" rx="1" fill="url(#favGold)" opacity="0.5"/>

  <!-- W monogram in the centre -->
  <text x="50" y="62" font-family="Georgia, serif" font-size="34" font-weight="bold" fill="url(#favGold)" text-anchor="middle" dominant-baseline="middle" opacity="0.85">W</text>

  <!-- Stars -->
  <circle cx="28" cy="25" r="0.9" fill="rgba(255,255,255,0.5)"/>
  <circle cx="68" cy="22" r="0.7" fill="rgba(255,255,255,0.4)"/>
  <circle cx="78" cy="30" r="0.6" fill="rgba(255,255,255,0.35)"/>
  <circle cx="14" cy="28" r="0.8" fill="rgba(255,255,255,0.45)"/>
  <circle cx="50" cy="20" r="0.6" fill="rgba(255,255,255,0.3)"/>

  <!-- Gold border accent -->
  <rect x="0" y="0" width="100" height="100" rx="22" fill="none" stroke="rgba(212,175,55,0.35)" stroke-width="1.2"/>
</svg>
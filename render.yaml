services:
  - type: web
    name: wura-grand-server
    env: node
    region: oregon
    plan: starter
    branch: main
    repo: https://github.com/Iconvibes/Wura
    buildCommand: "npm --prefix server install"
    startCommand: "npm --prefix server start"
    envVars:
      - key: MONGODB_URI
        value: "<your-mongodb-uri-here>"
      - key: JWT_SECRET
        value: "<change-this-secret>"
    healthCheckPath: "/api/rooms"
    autoDeploy: true
